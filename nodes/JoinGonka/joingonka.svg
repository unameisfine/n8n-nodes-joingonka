<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="60" height="60">
  <!-- Фон: тёмный квадрат скруглённый (как бренд joingonka) -->
  <rect width="60" height="60" rx="10" ry="10" fill="#0c1220"/>
  <!-- Внешний cyan ободок -->
  <circle cx="30" cy="30" r="20" fill="none" stroke="#00c8f0" stroke-width="2"/>
  <!-- Золотая точка (центральный элемент логотипа) -->
  <circle cx="30" cy="30" r="13" fill="#f59e0b"/>
  <!-- Буква G — Orbitron-подобная, beige #e8e0d4 -->
  <text x="30" y="39" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="800" fill="#0c1220">G</text>
</svg>
